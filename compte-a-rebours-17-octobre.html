<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101116">
<title>FrenchQuenQuen — Le compte à rebours</title>
<style>
:root{color-scheme:dark;--yellow:#ffd928;--ink:#101116;--soft:#b9bac2;--panel:#1b1c23}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 42%,#292b36 0,#16171d 43%,#0b0c10 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.stars{position:fixed;inset:0;pointer-events:none;opacity:.58;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 66%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 24%,#fff,transparent),radial-gradient(2px 2px at 75% 78%,#fff,transparent),radial-gradient(1px 1px at 53% 12%,#fff,transparent);background-size:350px 280px}.orbit{position:fixed;width:min(82vw,720px);aspect-ratio:1;border:1px solid #ffd92814;border-radius:50%;pointer-events:none}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #ffd92812;border-radius:50%;inset:11%}.orbit:after{inset:22%}main{position:relative;width:min(760px,100%);padding:clamp(28px,6vw,56px);border:1px solid #ffffff20;border-radius:26px;background:linear-gradient(145deg,#252630ed,#14151bea);box-shadow:0 28px 90px #0009;text-align:center;overflow:hidden}main:before{content:"";position:absolute;height:5px;top:0;left:0;right:0;background:linear-gradient(90deg,transparent,var(--yellow),transparent)}.brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--yellow);font-weight:900;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}.watch{width:30px;height:30px;display:grid;place-items:center;border:1px solid #ffd92880;border-radius:50%;font-size:16px;box-shadow:0 0 20px #ffd92822}.kicker{margin:30px 0 8px;color:var(--soft);font-size:.82rem;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,4.1rem);line-height:.98;font-weight:1000;letter-spacing:-.045em;text-transform:uppercase}h1 span{color:var(--yellow)}.date{margin:17px 0 34px;color:#dedee3;font-size:clamp(1rem,3vw,1.2rem)}.date strong{color:var(--yellow)}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2vw,14px)}.unit{padding:clamp(14px,3.5vw,22px) 6px;background:#0d0e13;border:1px solid #ffffff18;border-bottom:3px solid #ffd928a8;border-radius:13px}.number{display:block;color:var(--yellow);font-size:clamp(2rem,8vw,4.6rem);font-weight:1000;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px #ffd92828}.label{display:block;margin-top:9px;color:#b8b9c1;font-size:clamp(.62rem,1.8vw,.78rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase}#message{min-height:1.5em;margin:25px 0 0;color:#e7e7eb;font-weight:700}.share{margin-top:18px;padding:12px 21px;border:0;border-radius:999px;background:var(--yellow);color:#171719;font:900 .85rem Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 20px #ffd92828}.share:hover{transform:translateY(-1px);filter:brightness(1.06)}.footer{margin:23px 0 0;color:#7e808b;font-size:.67rem;letter-spacing:.18em;text-transform:uppercase}@media(max-width:420px){main{padding:30px 17px}.timer{gap:6px}.unit{border-radius:10px}.label{letter-spacing:.04em}}
</style>
</head>
<body><div class="stars" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div>
<main>
  <div class="brand"><span class="watch" aria-hidden="true">⌚</span> FrenchQuenQuen</div>
  <p class="kicker">Andromeda est activée</p>
  <h1>Le compte<br>à rebours <span>est lancé</span></h1>
  <p class="date"><strong>17 octobre 2026</strong> · 12 h · heure de Paris</p>
  <div class="timer" role="timer" aria-label="Compte à rebours">
    <div class="unit"><span class="number" id="days">00</span><span class="label">Jours</span></div>
    <div class="unit"><span class="number" id="hours">00</span><span class="label">Heures</span></div>
    <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="number" id="seconds">00</span><span class="label">Secondes</span></div>
  </div>
  <p id="message">Chaque seconde nous rapproche du grand moment.</p>
  <button class="share" id="share" type="button">Partager le compte à rebours</button>
  <p class="footer">Une aventure de l’univers QuenQuen</p>
</main>
<script>
const target=new Date('2026-10-17T12:00:00+02:00').getTime();
const pad=n=>String(n).padStart(2,'0');
function update(){const diff=target-Date.now();if(diff<=0){for(const id of ['days','hours','minutes','seconds'])document.getElementById(id).textContent='00';document.getElementById('message').textContent='C’est le grand moment !';return}document.getElementById('days').textContent=Math.floor(diff/86400000);document.getElementById('hours').textContent=pad(Math.floor(diff/3600000)%24);document.getElementById('minutes').textContent=pad(Math.floor(diff/60000)%60);document.getElementById('seconds').textContent=pad(Math.floor(diff/1000)%60);setTimeout(update,250)}update();
document.getElementById('share').addEventListener('click',async()=>{const data={title:document.title,text:'Le compte à rebours FrenchQuenQuen est lancé !',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);document.getElementById('share').textContent='Lien copié !'}}catch(_){}});
</script></body></html>
